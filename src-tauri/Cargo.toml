[package]
name = "financeos"
version = "2.0.0"
description = "Local invoice and receivables ledger"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "financeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
